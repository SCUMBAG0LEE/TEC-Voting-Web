name = "tec-voting-backend"
main = "src/index.ts"
compatibility_date = "2024-02-22"

# We use pure Web APIs, so we do not need nodejs_compat
compatibility_flags = [ "nodejs_compat" ]

[vars]
NODE_ENV = "production"
DB_USER = "postgres"
DB_NAME = "voting"
JWT_EXPIRES_IN = "24h"
CORS_ORIGIN = "https://your-frontend-domain.com"
# Provide placeholder for production JWT secret
JWT_SECRET = "REPLACE_ME_IN_CLOUDFLARE_DASHBOARD"

# Cloudflare Hyperdrive
# You will need to create a Hyperdrive configuration pointing to your Neon database
# Command: bunx wrangler hyperdrive create tec-db --connection-string="postgres://user:password@endpoint.neon.tech/dbname"
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "YOUR_HYPERDRIVE_ID_HERE"

# KV Namespace for Cache
# Command: bunx wrangler kv:namespace create CACHE
[[kv_namespaces]]
binding = "KV_CACHE"
id = "YOUR_KV_NAMESPACE_ID_HERE"

# Cloudflare Native Rate Limiting Configuration
# Configure WAF Rate Limiting in the Cloudflare Dashboard
# OR use the new Workers Rate Limiting Bindings:
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 100, period = 60 }

# Cloudflare R2 Native Binding for file storage (Candidate Photos / Backups)
# Command: bunx wrangler r2 bucket create tec-storage
[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "tec-storage"
